# ElectoralDrift US - serving stack (Milestone 3, step 1).
# Later steps add: postgres (PostGIS), redpanda, spark-streaming, producers.
services:
  backend:
    build: ./app/backend
    restart: unless-stopped
    environment:
      CORS_ORIGINS: "https://${SITE_ADDRESS:-localhost}"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./app/frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  # HTTPS: Caddy gets and renews a Let's Encrypt certificate for SITE_ADDRESS
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
